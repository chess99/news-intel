# 科技 RSS 订阅源配置
# 格式：name, url, lang, category, enabled
#
# category 可用值：
#   ai, ai_official, ai_research, ai_newsletter, ai_practitioner, ai_zh
#   tech_startup, tech_business, consumer_tech, consumer_tech_zh
#   deep_tech, deep_tech_research, tech_culture
#   community, open_source, open_source_zh
#   digital_life, engineering, product, startup, platform

sources:
  # === English Tech (Primary) ===
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    lang: en
    category: tech_startup
    enabled: true

  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    lang: en
    category: consumer_tech
    enabled: true

  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    lang: en
    category: deep_tech
    enabled: true

  - name: Wired
    url: https://www.wired.com/feed/rss
    lang: en
    category: tech_culture
    enabled: true

  - name: MIT Tech Review
    url: https://www.technologyreview.com/feed/
    lang: en
    category: deep_tech_research
    enabled: true

  - name: VentureBeat AI
    url: https://venturebeat.com/category/ai/feed/
    lang: en
    category: ai
    enabled: true

  - name: Hacker News
    url: https://news.ycombinator.com/rss
    lang: en
    category: community
    enabled: true

  - name: The Information
    url: https://www.theinformation.com/feed
    lang: en
    category: tech_business
    enabled: false  # may require login

  # === Chinese Tech ===
  - name: 36氪
    url: https://36kr.com/feed
    lang: zh
    category: tech_startup
    enabled: true

  - name: 爱范儿
    url: https://www.ifanr.com/feed
    lang: zh
    category: consumer_tech
    enabled: true

  - name: 极客公园
    url: http://www.geekpark.net/rss
    lang: zh
    category: consumer_tech
    enabled: true

  - name: 少数派
    url: https://sspai.com/feed
    lang: zh
    category: digital_life
    enabled: true

  - name: 钛媒体
    url: https://www.tmtpost.com/rss
    lang: zh
    category: tech_business
    enabled: true

  # === GitHub Trending ===
  - name: GitHub Trending
    url: https://github.com/trending.rss
    lang: en
    category: open_source
    enabled: false  # 406 Not Acceptable, GitHub 已不支持 trending RSS

  # === AI Official Blogs ===
  - name: Anthropic Blog
    url: https://www.anthropic.com/feed.rss
    lang: en
    category: ai_official
    enabled: false  # 无 RSS，需 Playwright 抓取或第三方 RSS 服务

  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    lang: en
    category: ai_official
    enabled: true

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    lang: en
    category: ai_official
    enabled: true  # 修正 URL: /rss/ -> /rss.xml (302 跳转目标)

  - name: Meta AI Blog
    url: https://ai.meta.com/blog/feed/
    lang: en
    category: ai_official
    enabled: false  # 无 RSS

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    lang: en
    category: ai_research
    enabled: true

  # === AI Newsletters ===
  - name: The Batch (DeepLearning.AI)
    url: https://www.deeplearning.ai/the-batch/feed/
    lang: en
    category: ai_newsletter
    enabled: false  # 无官方 RSS，thebatch.substack.com/feed 是无关账号

  - name: Latent Space
    url: https://www.latent.space/feed
    lang: en
    category: ai_newsletter
    enabled: true

  - name: Simon Willison Blog
    url: https://simonwillison.net/atom/everything/
    lang: en
    category: ai_practitioner
    enabled: true

  # === AI Research ===
  - name: Papers With Code
    url: https://paperswithcode.com/rss
    lang: en
    category: ai_research
    enabled: true

  # === Product & Startup ===
  - name: Product Hunt
    url: https://www.producthunt.com/feed?category=undefined
    lang: en
    category: product
    enabled: true

  # === Engineering ===
  - name: InfoQ
    url: https://feed.infoq.com/
    lang: en
    category: engineering
    enabled: true

  # === Chinese AI ===
  - name: 机器之心
    url: https://www.jiqizhixin.com/rss
    lang: zh
    category: ai_zh
    enabled: true

  - name: 量子位
    url: https://www.qbitai.com/rss
    lang: zh
    category: ai_zh
    enabled: true

  # === Chinese Tech ===
  - name: Solidot
    url: https://www.solidot.org/index.rss
    lang: zh
    category: open_source_zh
    enabled: true

  # === Platform ===
  - name: GitHub Changelog
    url: https://github.blog/changelog/feed/
    lang: en
    category: platform
    enabled: true

  # === AI Specific (legacy disabled) ===
  - name: AI Reddit
    url: https://www.reddit.com/r/artificial/.rss
    lang: en
    category: ai
    enabled: false  # reddit rss needs login

